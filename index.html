.node[data-depth="1"].selected-node .cell{stroke-width:4.2!important}.node[data-depth="2"].selected-node .cell{stroke-width:3.7!important}.node[data-depth="3"].selected-node .cell{stroke-width:3.15!important}

0px}.content-list{padding-left:18px}.content-list li{margin:7px 0}.catalog-item{display:block}.catalog-item small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.catalog-nested{margin-left:13px;padding-left:9px;border-left:1px solid var(--line)}.system-card{padding:13px 0;border-bottom:1px solid #dfdbd2}.system-card strong{display:block;font-size:13px}.system-card small{display:block;color:var(--muted);font-size:11px;line-height:1.55;margin-top:4px}.source-link{margin-top:8px;border:0;background:transparent;padding:0;min-height:0;text-decoration:underline;text-underline-offset:3px;font-size:11px;color:var(--muted)}.panel-group{margin:24px 0}.panel-group:first-of-type{margin-top:12px}.panel-note{padding:12px 13px;border:1px solid var(--line);border-radius:7px;background:#f1eee7;font-size:12px;line-height:1.55;color:var(--muted)}.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.status-chip{border:1px solid var(--line);border-radius:6px;padding:9px;font-size:10px;color:var(--muted)}.side-footer{padding:13px 22px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}

(function(){
'use strict';
var SCHEMA={"roots":[{"id":"brief","title":"BRIEF","purpose":"Зафиксировать исходную рамку проекта: что сообщает заказчик, какую задачу он ставит, чего ожидает и с какими ресурсами и ограничениями мы начинаем работу.","kind":"input","children":[{"id":"brief.context","title":"CONTEXT","purpose":"Понять, кто начинает проект, что уже существует и где проходят границы текущей работы.","kind":"input","children":[],"content":[{"title":"Practice / Organization","purpose":"Организация, практика или автор и область деятельности."},{"title":"History","purpose":"Краткая история и значимые этапы."},{"title":"Project Scope","purpose":"Что входит и не входит в текущую работу."},{"title":"Current Name","purpose":"Текущее публичное имя; при сложной системе названий фиксируется существующая схема."}]},{"id":"brief.challenge","title":"CHALLENGE","purpose":"Зафиксировать исходную проблему и желаемое изменение так, как они понимаются на старте.","kind":"input","children":[],"content":[{"title":"Business Problem","purpose":"Причина обращения со стороны бизнеса или автора."},{"title":"Reported Customer Problem","purpose":"Представление заказчика о проблеме аудитории; это исходное знание, а не автоматически подтверждённый факт."},{"title":"Desired Change","purpose":"Что должно стать иначе по сравнению с текущей ситуацией."}]},{"id":"brief.goals","title":"GOALS","purpose":"Зафиксировать направление бизнеса и роль бренд-проекта, не превращая бизнес-метрики в обещание результата брендинга.","kind":"input","children":[],"content":[{"title":"Business Goal","purpose":"Актуальная бизнес-цель или направление."},{"title":"Brand Task","purpose":"Какое изменение должна поддержать бренд-система."},{"title":"Expected Effect","purpose":"Ожидания заказчика с отделением результата проекта от последующих бизнес-эффектов."},{"title":"First Application","purpose":"Ближайшая реальная ситуация, где результат должен быть применён."}]},{"id":"brief.offer","title":"OFFER","purpose":"Коротко зафиксировать, что заказчик считает своим текущим предложением. Подробная архитектура предложения живёт в SERVICE SYSTEM.","kind":"input","children":[],"content":[{"title":"Starting Description","purpose":"Как заказчик своими словами описывает то, что продаёт / предлагает."},{"title":"Main Offers","purpose":"Короткий список основных продуктов или услуг, если он нужен для ориентации."}]},{"id":"brief.inputs","title":"INPUTS","purpose":"Зафиксировать реальные ресурсы, материалы, ограничения и условия проекта.","kind":"input","children":[],"content":[{"title":"Participation","purpose":"Доступные способы и объём участия заказчика / команды."},{"title":"Delegation","purpose":"Что предполагается передать другим исполнителям."},{"title":"Budget","purpose":"Доступный бюджет и связанные ограничения."},{"title":"Timing","purpose":"Сроки и дедлайны."},{"title":"Capacity","purpose":"Операционные ограничения и допустимая нагрузка."},{"title":"Fixed Constraints","purpose":"Что нельзя менять в рамках проекта."},{"title":"Materials & Access","purpose":"Доступные документы, исходники, системы и доступы."}]}],"content":[{"title":"Initial Assumptions","purpose":"Исходные предположения хранятся как метаданные и позже связываются с соответствующими объектами Research, Audit или Service System."},{"title":"Open Questions","purpose":"Неизвестные, способные изменить решение. Не отдельный пузырь, а рабочий список вопросов."},{"title":"Status / Version","purpose":"Статус согласования и история существенных изменений брифа."}]},{"id":"audit","title":"AUDIT","purpose":"Зафиксировать наблюдаемое текущее состояние конкретного бренда: что реально существует, как это устроено, где есть несогласованность и чем подтверждаются выводы.","kind":"observation","children":[{"id":"audit.current","title":"CURRENT STATE","purpose":"Единый канонический объект текущего состояния бренда с несколькими разрезами и представлениями.","kind":"observation","children":[],"content":[{"title":"Identity","purpose":"Существующая визуальная и вербальная идентичность."},{"title":"Messaging","purpose":"Фактически используемые сообщения и формулировки."},{"title":"Channels / Materials","purpose":"Сайт, social, презентации, шаблоны, контент и другие носители."},{"title":"Offer Representation","purpose":"Как текущее предложение реально представлено в материалах."},{"title":"Touchpoints — view","purpose":"Где люди фактически сталкиваются с брендом. Это разрез CURRENT STATE, не отдельный канонический пузырь."},{"title":"Consistency / Breaks","purpose":"Наблюдаемая согласованность, противоречия и разрывы."},{"title":"Reviewed / Missing","purpose":"Что просмотрено и каких материалов или данных не хватает."},{"title":"Evidence / Sources","purpose":"Материалы, на которых основаны утверждения аудита."},{"title":"Brief Check","purpose":"Подтверждение или противоречие исходным утверждениям из BRIEF."},{"title":"Cases / Verifiable Results","purpose":"Существующие кейсы и проверяемые результаты, если они доступны."}]}],"content":[]},{"id":"research","title":"RESEARCH","purpose":"Получить и структурировать недостающее знание о людях, поле выбора, предметной области и визуальном контексте, а затем синтезировать выводы до принятия стратегических решений.","kind":"research","children":[{"id":"research.audience","title":"AUDIENCE","purpose":"Структурировать понимание аудитории: по умолчанию — нормализовать знание заказчика и имеющиеся данные; при необходимости — углублять и валидировать исследованием.","kind":"research","children":[],"content":[{"title":"Audience Group","purpose":"Группа / сегмент без обязательной псевдоперсоны."},{"title":"Role","purpose":"Покупатель, пользователь, влияющий участник и т. п."},{"title":"Situation / Trigger","purpose":"Контекст и событие, в котором возникает выбор."},{"title":"Need / Job","purpose":"Какое изменение или задачу человек хочет решить."},{"title":"Selection Criteria","purpose":"По каким признакам он сравнивает варианты."},{"title":"Barrier","purpose":"Что мешает выбору или действи document.getElementById('search').addEventListener('input',function(){var q=this.value.trim().toLowerCase();if(!q){showPanel();return}var found=all.filter(function(n){var content=(n.content||[]).map(function(x){return(x.title||'')+' '+(x.purpose||'')}).join(' ');return(n.title+' '+n.purpose+' '+content).toLowerCase().indexOf(q)>=0}).slice(0,60);inspector.innerHTML='<h2>Поиск</h2>'+found.map(function(n){return'<button class="catalog-item" data-select="'+esc(n.id)+'">'+esc(n.title)+'<small>Уровень '+depthOf[n.id]+'</small></button>'}).join('');var b=inspector.querySelectorAll('[data-select]');for(var i=0;i<b.length;i++)b[i].onclick=function(){setTab('detail');select(this.getAttribute('data-select'),false)}});
try{reset();stateEl.textContent='7 модулей'}catch(err){stateEl.textContent='Ошибка интерактивного режима';console.error(err);showPanel()}
})();
</script></body></html>
